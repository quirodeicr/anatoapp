.pj-nombre input:focus{border-style:solid;border-color:var(--verde);outline:none}
.pj-lapiz{position:absolute;right:11px;color:var(--tx2);font-size:16px;pointer-events:none}
.pj-nombre .btn{font-size:18px;padding:6px 10px}
.esc-cartel-tabla{fill:#b07a4a;stroke:#7c5230;stroke-width:1}
.esc-cartel-hilo{stroke:#7c5230;stroke-width:1}
.esc-cartel text{font:800 11.5px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#fff7ea;letter-spacing:.02em}
.escena-wrap{position:relative;margin-top:14px;border-radius:var(--r);overflow:hidden;border:2px solid var(--linea)}
.escena{display:block;width:100%;height:auto}
.esc-pared{fill:color-mix(in srgb,var(--verde-cl) 60%,var(--bg))}
.esc-piso{fill:color-mix(in srgb,#c8a27a 62%,var(--bg))}
.esc-zocalo{stroke:color-mix(in srgb,#9c6c43 70%,var(--bg));stroke-width:4}
.esc-tabla{stroke:rgba(0,0,0,.07);stroke-width:1.5}
.esc-ventana rect{fill:color-mix(in srgb,#7dd3fc 65%,var(--bg));stroke:color-mix(in srgb,#fff 80%,var(--bg));stroke-width:4}
.esc-ventana path{stroke:color-mix(in srgb,#fff 80%,var(--bg));stroke-width:3}
.esc-sol{fill:#fde68a}
.escena .ap{cursor:pointer;transition:filter .15s}
.escena .ap:hover{filter:brightness(1.12) drop-shadow(0 0 3px rgba(255,255,255,.7))}
.globo-pj{position:absolute;left:50%;top:3%;transform:translateX(-50%);width:max-content;max-width:min(80%,340px);background:var(--sup);color:var(--tx);border:2px solid var(--linea2);border-radius:14px;padding:7px 12px;font-size:14px;font-weight:600;line-height:1.35;box-shadow:var(--sombra);text-align:center}
.globo-pj::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-8px;border:8px solid transparent;border-top-color:var(--linea2);border-bottom:0}
.globo-pj.entra{animation:globo .3s ease-out}
@keyframes globo{from{opacity:0;transform:translate(-50%,6px) scale(.95)}}
.pj-progreso{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin:12px 0 4px;font-size:14px}
.pj-progreso .pj-prox{flex:1;min-width:210px}
.pj-h{font-size:12px;font-weight:800;margin:20px 0 8px;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em}
.pj-h small{text-transform:none;letter-spacing:0;font-weight:600}
.sws{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sw{width:36px;height:36px;border-radius:50%;background:var(--sw);border:3px solid var(--sup);box-shadow:0 0 0 2px var(--linea2);cursor:pointer;font-size:12px;display:grid;place-items:center;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--azul)}
.sw.bloq{filter:saturate(.35) opacity(.55);cursor:not-allowed}
.recien{animation:recien 1.2s ease-in-out 3}
@keyframes recien{50%{box-shadow:0 0 0 4px var(--mag)}}
.pj-ops{display:flex;flex-wrap:wrap;gap:8px}
.pj-op{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:12px;padding:7px 12px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pj-op.on{border-color:var(--azul);background:var(--azul-cl);color:var(--azul)}
.pj-op.bloq{opacity:.5;cursor:not-allowed}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.ap-card{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:var(--r);padding:10px;display:grid;gap:4px;justify-items:center;align-content:start;text-align:center;cursor:pointer}
.ap-card:hover{border-color:var(--verde)}
.ap-card .ap-mini{width:100%;height:70px}
.ap-card b{font-size:14px;font-weight:800}
.ap-card small{font-size:12px;color:var(--tx2);line-height:1.35}
.ap-card .barra{width:100%}
.ap-card .barra span{background:var(--mag)}
.ap-card.bloq .ap-mini{filter:grayscale(1) opacity(.35)}
.ap-ficha{text-align:center}
.ap-ficha h3{font-size:20px;font-weight:800;margin-top:6px}
.ap-ficha-dib .ap-mini{width:100%;max-width:260px;height:120px}
.ap-ficha>p{text-align:left;font-size:14.5px;line-height:1.55;margin-top:8px}
.ap-ficha .barra{margin-top:10px}
.ap-ficha .barra span{background:var(--mag)}
.ap-ficha .btn{margin-top:10px}
.ap-examen{margin-top:12px;background:var(--azul-cl);border-radius:12px;padding:10px 12px;text-align:left}
.ap-examen b{color:var(--azul);font-size:13px}
.ap-examen p{margin-top:4px;font-size:14px;line-height:1.5}
.ap-bloq{font-weight:700;color:var(--tx2)}
.fin-pj{display:flex;gap:12px;align-items:center;text-align:left;margin:16px auto 0;max-width:420px;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:8px 14px 8px 8px}
.fin-pj.con-nuevos{border-color:color-mix(in srgb,var(--mag) 50%,transparent);background:var(--mag-cl)}
.fin-pj-av .pj-svg{width:56px;height:98px;display:block}
.fin-pj b{display:block;font-weight:800;line-height:1.3}
.fin-pj small{display:block;color:var(--tx2);font-size:13px;margin-top:2px}
.fin-pj ul{list-style:none;margin-top:4px;font-size:14px;font-weight:600;display:grid;gap:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  /* Si no hay tema guardado se respeta el del sistema (o el del visor). */
  try {
    var g = localStorage.getItem('anatoapp.tema');
    if (g) document.documentElement.setAttribute('data-theme', g);
  } catch (e) {}
  document.getElementById('tema').onclick = function(){
    var act = document.documentElement.getAttribute('data-theme');
    if (!act) act = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    var nuevo = act === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nuevo);
    try { localStorage.setItem('anatoapp.tema', nuevo); } catch (e) {}
  };
})();
</script>
