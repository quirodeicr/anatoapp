<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilates Lab — Anatomía aplicada al Pilates</title>
<meta name="theme-color" content="#0d9488">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><text y='52' font-size='52'>🦴</text></svg>">
<style>
/* ===== tokens: los colores de lapicera de los apuntes + estados ===== */
:root{
  --bg:#f7f7f5; --sup:#ffffff; --sup2:#f0efec; --sup3:#e7e5e1;
  --tx:#1c1b19; --tx2:#6b6862; --tx3:#a19d96; --linea:#e3e1dc; --linea2:#d2cec7;
  --verde:#0d9488; --verde-o:#0a7169; --verde-cl:#ccfbf1;
  --ok:#16a34a; --ok-o:#11803a; --ok-cl:#dcfce7; --ok-tx:#14532d;
  --mal:#dc2626; --mal-o:#ad1d1d; --mal-cl:#fee2e2; --mal-tx:#7f1d1d;
  --xp:#f59e0b; --xp-o:#c47a05; --xp-cl:#fef3c7; --xp-tx:#78350f;
  --azul:#2563eb; --azul-o:#1d4ec2; --azul-cl:#dbeafe;
  --fuego:#f97316;
  --rojo:#e11d48; --rojo-cl:#ffe4e9; --mag:#c026d3; --mag-cl:#fae8ff;
  --on:#ffffff;
  --r:16px; --sombra:0 1px 2px rgba(0,0,0,.05),0 10px 30px -14px rgba(0,0,0,.18);
  --ap-calza:#6d3d68; --ap-calza-l:#4f2b4c; --ap-borde:rgba(60,34,20,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14141a; --sup:#1d1d24; --sup2:#26262f; --sup3:#30303a;
    --tx:#f0efec; --tx2:#a3a09a; --tx3:#6e6b66; --linea:#33333d; --linea2:#454552;
    --verde:#2dd4bf; --verde-o:#149c8c; --verde-cl:#0f3a36;
    --ok:#22c55e; --ok-o:#15913f; --ok-cl:#10311f; --ok-tx:#bbf7d0;
    --mal:#f87171; --mal-o:#c24848; --mal-cl:#3d1616; --mal-tx:#fecaca;
    --xp:#fbbf24; --xp-o:#c68d0a; --xp-cl:#382a0a; --xp-tx:#fde68a;
    --azul:#60a5fa; --azul-o:#3a78cf; --azul-cl:#172a4a;
    --fuego:#fb923c;
    --rojo:#fb7185; --rojo-cl:#43121f; --mag:#e879f9; --mag-cl:#3d1043;
    --on:#0b0b10;
    --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --ap-calza:#8a4f84; --ap-calza-l:#6a3c66; --ap-borde:rgba(255,238,226,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#14141a; --sup:#1d1d24; --sup2:#26262f; --sup3:#30303a;
  --tx:#f0efec; --tx2:#a3a09a; --tx3:#6e6b66; --linea:#33333d; --linea2:#454552;
  --verde:#2dd4bf; --verde-o:#149c8c; --verde-cl:#0f3a36;
  --ok:#22c55e; --ok-o:#15913f; --ok-cl:#10311f; --ok-tx:#bbf7d0;
  --mal:#f87171; --mal-o:#c24848; --mal-cl:#3d1616; --mal-tx:#fecaca;
  --xp:#fbbf24; --xp-o:#c68d0a; --xp-cl:#382a0a; --xp-tx:#fde68a;
  --azul:#60a5fa; --azul-o:#3a78cf; --azul-cl:#172a4a;
  --fuego:#fb923c;
  --rojo:#fb7185; --rojo-cl:#43121f; --mag:#e879f9; --mag-cl:#3d1043;
  --on:#0b0b10;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7);
  --ap-calza:#8a4f84; --ap-calza-l:#6a3c66; --ap-borde:rgba(255,238,226,.55);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--tx);
  font:500 16px/1.5 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:92px; overflow-x:hidden;
}
button{font:inherit;color:inherit}
.c-verde{--ac:var(--verde);--ac-cl:var(--verde-cl)}
.c-rojo{--ac:var(--rojo);--ac-cl:var(--rojo-cl)}
.c-magenta{--ac:var(--mag);--ac-cl:var(--mag-cl)}

/* ===== cabecera ===== */
header{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(12px);
  border-bottom:2px solid var(--linea); padding:10px 16px;
  display:flex; align-items:center; gap:10px;
}
header .logo{font-size:20px}
header h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
header .sp{flex:1}
#hud{display:flex;gap:6px}
.hud-c{font-size:13px;font-weight:700;color:var(--tx2);padding:5px 9px;border-radius:99px;background:var(--sup2);white-space:nowrap}
.hud-c b{font-weight:800}
.hud-c.fuego.on{color:var(--fuego);background:color-mix(in srgb,var(--fuego) 14%,transparent)}
.hud-c.xp b{color:var(--xp-o)}
#tema{background:none;border:2px solid var(--linea);color:var(--tx2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px;flex-shrink:0}
#tema:hover{background:var(--sup2)}
@media(max-width:400px){.hud-c.nv{display:none} header h2{display:none}}

main{max-width:720px;margin:0 auto;padding:20px 16px 40px}

/* ===== navegación ===== */
.nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:color-mix(in srgb,var(--sup) 94%,transparent); backdrop-filter:blur(14px);
  border-top:2px solid var(--linea);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav button{
  flex:1;background:none;border:2px solid transparent;cursor:pointer;color:var(--tx2);
  display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;
  padding:6px 1px;border-radius:12px;font-size:clamp(9px,2.4vw,11px);font-weight:700;
}
/* 8 pestañas: en pantallas muy angostas, la letra un poco más chica */
@media(max-width:350px){.nav{padding-inline:2px}.nav button{font-size:8.2px;padding-inline:0;border-width:1px}}
.nav button span{font-size:19px;line-height:1.1}
.nav button.on{color:var(--verde);background:var(--verde-cl);border-color:color-mix(in srgb,var(--verde) 40%,transparent)}
body.en-sesion header, body.en-sesion .nav{display:none}
body.en-sesion{padding-bottom:0}
body.en-sesion main{padding:0;max-width:none}

/* ===== tipografía ===== */
h1,.tit{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.sub{color:var(--tx2);font-size:14.5px;margin-top:8px;max-width:58ch}
.micro{color:var(--tx2);font-size:12.5px;line-height:1.5;margin-top:10px;max-width:60ch}
.centro{text-align:center;margin-left:auto;margin-right:auto}
.secc{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--tx2);margin:32px 0 12px}
.vacio{color:var(--tx2);font-size:14px;padding:14px 0}

/* ===== botones ===== */
.btn3d{
  --c:var(--verde); --co:var(--verde-o);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--c); color:var(--on); border:0; border-radius:14px;
  padding:14px 20px; font-size:15px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  box-shadow:0 4px 0 var(--co); cursor:pointer; transition:transform .08s,box-shadow .08s,filter .15s;
  min-height:50px;
}
.btn3d:hover{filter:brightness(1.06)}
.btn3d:active{transform:translateY(3px);box-shadow:0 1px 0 var(--co)}
.btn3d.btn3d:disabled{--c:var(--sup3);--co:var(--linea2);color:var(--tx3);cursor:default;filter:none;transform:none;border:0}
.btn3d.verde{--c:var(--ok);--co:var(--ok-o)}
.btn3d.gris{--c:var(--sup);--co:var(--linea2);color:var(--tx2);border:2px solid var(--linea2)}
.btn3d.naranja{--c:var(--xp);--co:var(--xp-o);color:#1c1405}
.btn3d.rojo{--c:var(--mal);--co:var(--mal-o)}
.btn3d.azul{--c:var(--azul);--co:var(--azul-o)}
.btn3d.ancho{width:100%}
.btn{background:var(--sup);color:var(--tx);border:2px solid var(--linea);border-bottom-width:4px;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--sup2)}
.btn:active{border-bottom-width:2px;transform:translateY(2px)}
.btn.ghost{background:none}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn.ancho{width:100%;margin-top:10px}
.btn.peligro{color:var(--mal);border-color:color-mix(in srgb,var(--mal) 35%,transparent)}
.fila{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}

/* ===== inicio ===== */
.meta-card{display:flex;gap:18px;align-items:center;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:16px 18px}
.meta-txt b{font-size:16px;font-weight:800}
.meta-txt p{font-size:13.5px;color:var(--tx2);margin-top:2px}
.racha-txt{font-weight:700;color:var(--fuego)!important}
.racha-txt.riesgo{color:var(--mal)!important}
.anillo{
  --p:0; --t:64px; width:var(--t);height:var(--t);border-radius:50%;flex-shrink:0;
  background:conic-gradient(var(--xp) calc(var(--p)*360deg),var(--sup2) 0);
  display:grid;place-items:center;position:relative;
}
.anillo::before{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--sup)}
.anillo span{position:relative;font-size:13px;font-weight:800;text-align:center;line-height:1.1}
.anillo.grande{--t:84px}
.anillo.grande b{display:block;font-size:22px}
.anillo.grande small{font-size:10px;color:var(--tx2);font-weight:700}
.repaso-card{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-top:12px;
  background:var(--xp-cl);border:2px solid color-mix(in srgb,var(--xp) 45%,transparent);border-radius:var(--r);padding:16px 18px}
.repaso-card b{font-size:16px;font-weight:800;color:var(--xp-tx)}
.repaso-card p{font-size:13.5px;color:var(--xp-tx);opacity:.85;margin-top:2px}
.repaso-card.aldia{background:var(--ok-cl);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.repaso-card.aldia b,.repaso-card.aldia p{color:var(--ok-tx)}
@media(max-width:480px){.repaso-card{flex-direction:column;align-items:stretch}}

/* ruta */
.ruta{display:flex;flex-direction:column;align-items:center;gap:26px;padding:14px 0 30px}
.nodo-wrap{transform:translateX(var(--x));display:flex;flex-direction:column;align-items:center;position:relative;width:150px;text-align:center}
@media(max-width:400px){.nodo-wrap{transform:translateX(calc(var(--x)*.6))}}
.nodo{
  --p:0; width:82px;height:82px;border-radius:50%;border:0;cursor:pointer;position:relative;
  background:conic-gradient(var(--ok) calc(var(--p)*360deg),var(--sup3) 0);
  padding:7px; box-shadow:0 6px 0 var(--linea2); transition:transform .1s;
}
.nodo:active{transform:translateY(4px);box-shadow:0 2px 0 var(--linea2)}
.nodo-ico{width:100%;height:100%;border-radius:50%;background:var(--sup);display:grid;place-items:center;font-size:30px}
.nodo.vista .nodo-ico{background:var(--xp-cl)}
.nodo.rec{animation:latir 1.8s ease-in-out infinite}
.nodo-badge{position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;
  background:var(--xp);color:#1c1405;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.globo{position:absolute;top:-34px;background:var(--sup);border:2px solid var(--linea);color:var(--ok);
  font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:10px;
  animation:flotar 2s ease-in-out infinite;white-space:nowrap}
.globo::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--sup);
  border-right:2px solid var(--linea);border-bottom:2px solid var(--linea);transform:translateX(-50%) rotate(45deg)}
.estrellas{color:var(--xp);font-size:16px;letter-spacing:2px;margin-top:8px;line-height:1}
.estrellas .apagada{color:var(--sup3)}
.nodo-nom{font-size:14px;font-weight:800;margin-top:4px;line-height:1.25}
.nodo-mem{font-size:11.5px;color:var(--tx2);font-weight:600}

/* modal / hoja de unidad */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.modal-in{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
  animation:subir .25s ease-out;max-height:88vh;overflow:auto}
@media(min-width:620px){.modal{align-items:center}.modal-in{border-radius:22px}}
.modal-msg{font-size:16px;font-weight:600;margin-bottom:18px;line-height:1.45}
.mu-h{display:flex;gap:14px;align-items:center}
.mu-ico{font-size:34px;width:60px;height:60px;border-radius:50%;background:var(--sup2);display:grid;place-items:center;flex-shrink:0}
.mu-h h3{font-size:20px;font-weight:800}
.mu-h p{font-size:13px;color:var(--tx2)}
.mu-est{margin:12px 0 8px}
.mu-est .estrellas{font-size:22px}
.mu-mem{font-size:13.5px;color:var(--tx2);margin:10px 0 16px}
.modal-in .btn3d.ancho{margin-top:14px}

/* ===== barras ===== */
.barra{height:8px;background:var(--sup2);border-radius:99px;overflow:hidden}
.barra span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.barra.gruesa{height:14px}
.barra.xpb span{background:var(--xp)}

/* ===== sesión ===== */
.sesion{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:14px 16px 150px}
.ses-top{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:5}
.ses-x{background:none;border:0;font-size:22px;color:var(--tx3);cursor:pointer;width:36px;height:36px;border-radius:10px;flex-shrink:0}
.ses-x:hover{background:var(--sup2);color:var(--tx2)}
.ses-prog{flex:1;height:16px;background:var(--sup3);border-radius:99px;overflow:hidden}
.ses-prog span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .45s cubic-bezier(.4,0,.2,1);position:relative;min-width:16px}
.ses-prog span::after{content:'';position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:99px;background:rgba(255,255,255,.35)}
.ses-combo{font-size:15px;font-weight:800;color:var(--tx3);min-width:44px;text-align:right}
.ses-combo.on{color:var(--fuego);animation:pop .3s}
.ses-cuerpo{padding-top:14px}
.ses-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:22px}
.tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:8px;background:var(--sup2);color:var(--tx2)}
.tag.nuevo{background:var(--azul-cl);color:var(--azul)}
.tag.repite{background:var(--xp-cl);color:var(--xp-tx)}
.tag.tag-tema{text-transform:none;letter-spacing:0;font-weight:700;background:var(--ac-cl);color:var(--ac)}
.ses-consigna{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--tx2)}
.ses-preg{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.3;margin-top:6px}
.ses-ej{margin-top:20px}
.ses-pie{position:fixed;left:0;right:0;bottom:0;z-index:10;border-top:2px solid var(--linea);background:var(--bg);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.ses-pie.oculto{visibility:hidden}
.ses-pie-in{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;gap:12px}
.ses-pie-in .btn3d{flex:1;max-width:220px}
.ses-pie-in #comprobar{margin-left:auto}
.cuenta{font-size:14px;color:var(--tx2);margin-bottom:12px}
.cuenta.suave{font-size:12.5px;text-align:center;margin:14px 0 0}
.cuenta b{color:var(--tx)}
.ctx{font-size:15px;color:var(--tx2);margin:-4px 0 14px;font-style:italic}

/* fichas */
.ficha{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sup);color:var(--tx);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:13px;
  padding:9px 14px;font-size:15px;font-weight:700;line-height:1.25;text-align:left;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:background .12s,border-color .12s,transform .12s;
}
.ficha:hover{background:var(--sup2)}
.ficha:active{cursor:grabbing}
.ficha.ph{background:var(--sup3);border-color:var(--sup3);color:transparent;cursor:default;pointer-events:none}
.ficha.sel{border-color:var(--azul);background:var(--azul-cl);color:var(--azul)}
.ficha.arrastrando{opacity:.3}
.ficha.bien{border-color:var(--ok);background:var(--ok-cl);color:var(--ok-tx)}
.ficha.mal{border-color:var(--mal);background:var(--mal-cl);color:var(--mal-tx)}
.ficha.falto{border-style:dashed;border-color:var(--ok);color:var(--ok)}
.ficha.bloq{cursor:default}
.fantasma{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;margin:0;rotate:-3deg;
  box-shadow:0 14px 30px -8px rgba(0,0,0,.35);border-color:var(--azul)}
.slot{display:inline-flex}
.banco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px;min-height:48px}
.zona-resp{
  min-height:118px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding:8px 2px;
  border-top:2px solid var(--linea);border-bottom:2px solid var(--linea);
  background-image:repeating-linear-gradient(to bottom,transparent 0 56px,var(--linea) 56px 58px);
  transition:background-color .15s;
}
.zona-resp.sobre{background-color:var(--azul-cl)}
.zona-resp.orden{counter-reset:paso}
.zona-resp.orden .ficha::before{counter-increment:paso;content:counter(paso);
  width:22px;height:22px;border-radius:50%;background:var(--sup3);color:var(--tx2);font-size:12px;font-weight:800;
  display:inline-grid;place-items:center;flex-shrink:0}

/* completar */
.frase{font-size:19px;line-height:2.5;font-weight:600}
.frase.chica{font-size:15px;line-height:1.6}
.hueco{display:inline-flex;min-width:104px;min-height:46px;vertical-align:middle;margin:3px 4px;
  border-bottom:3px solid var(--tx3);border-radius:8px 8px 0 0;align-items:center;justify-content:center;
  transition:background .15s}
.hueco.sobre{background:var(--azul-cl)}
.hueco .ficha{margin:2px 0}
.sol-h{color:var(--ok-tx);background:var(--ok-cl);padding:1px 6px;border-radius:6px}

/* clasificar */
/* grilla compacta: en celular todo entra en una pantalla y no hay que
   desplazarse mientras se arrastra */
.cubetas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cubetas.n3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:560px){.cubetas.n3{grid-template-columns:repeat(2,minmax(0,1fr))}.cubetas.n3 .cubeta:last-child{grid-column:1/-1}}
.cubeta{border:2px dashed var(--linea2);border-radius:16px;padding:8px;min-height:88px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;transition:background .15s,border-color .15s}
.cubeta h5{width:100%;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin-bottom:2px}
.cubeta .ficha{font-size:13px;padding:6px 10px;max-width:100%}
.cubeta.sobre,.eligiendo .cubeta{border-color:var(--azul);background:var(--azul-cl);cursor:pointer}

/* emparejar */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pares .col{display:grid;gap:10px;align-content:start}
.par{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:14px;
  padding:12px 12px;min-height:58px;font-size:14.5px;font-weight:700;line-height:1.3;cursor:pointer;
  transition:background .12s,border-color .12s,opacity .3s}
.par:hover{background:var(--sup2)}
.par.sel{border-color:var(--azul);background:var(--azul-cl);color:var(--azul)}
.par.hecho{border-color:var(--ok);background:var(--ok-cl);color:var(--ok-tx);opacity:.45;cursor:default}
.par.error{border-color:var(--mal);background:var(--mal-cl);color:var(--mal-tx);animation:sacudir .35s}

/* opción múltiple */
.ops{display:grid;gap:10px}
.op{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sup);
  border:2px solid var(--linea2);border-bottom-width:4px;border-radius:14px;padding:13px 15px;
  font-size:15px;font-weight:600;line-height:1.4;cursor:pointer;transition:background .12s,border-color .12s}
.op:hover:not(:disabled){background:var(--sup2)}
.op-k{width:26px;height:26px;border:2px solid var(--linea2);border-radius:8px;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--tx3);flex-shrink:0}
.op.sel{border-color:var(--azul);background:var(--azul-cl)}
.op.sel .op-k{border-color:var(--azul);color:var(--azul)}
.op.bien{border-color:var(--ok);background:var(--ok-cl);color:var(--ok-tx)}
.op.mal{border-color:var(--mal);background:var(--mal-cl);color:var(--mal-tx)}
.op:disabled{cursor:default}

/* escribir */
.gen-l{display:block;font-size:13px;color:var(--tx2);margin-bottom:8px;line-height:1.45}
.gen-t{width:100%;background:var(--sup);border:2px solid var(--linea2);border-radius:14px;padding:12px 14px;
  font:inherit;font-size:16px;color:var(--tx);resize:vertical;line-height:1.6}
.gen-t:focus{outline:none;border-color:var(--azul)}
.marcador{font-size:13px;color:var(--tx2);margin-top:8px}
.marcador.lleno{color:var(--ok);font-weight:700}

/* flashcard */
.flip{perspective:1400px}
.flip-in{display:grid;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip.girada .flip-in{transform:rotateY(180deg)}
.cara{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sup);
  border:2px solid var(--linea2);border-bottom-width:5px;border-radius:20px;padding:22px;min-height:230px}
.dorso{transform:rotateY(180deg)}
.cara-tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx3)}
.flip-q{font-size:21px;font-weight:800;line-height:1.35;margin-top:10px}
.flip-hint{font-size:13px;color:var(--tx2);margin-top:14px}
.flash-acc{margin-top:18px}
.predq{font-size:13px;font-weight:800;color:var(--tx2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.notas4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:460px){.notas4{grid-template-columns:repeat(2,1fr)}}
.cal{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:14px;padding:10px 4px;cursor:pointer;text-align:center}
.cal:active{border-bottom-width:2px;transform:translateY(2px)}
.cal b{display:block;font-size:13.5px;font-weight:800}
.cal i{display:block;font-style:normal;font-size:11px;color:var(--tx2);margin-top:2px}
.cal.n1 b{color:var(--mal)} .cal.n2 b{color:var(--xp-o)} .cal.n3 b{color:var(--ok)} .cal.n4 b{color:var(--azul)}

.resp{list-style:none;display:grid;gap:7px;margin-top:10px}
.resp li{background:var(--sup2);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.45}
.porque{margin-top:14px;background:var(--verde-cl);border-radius:12px;padding:12px 14px}
.porque b{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);margin-bottom:4px}
.porque p{font-size:14px;line-height:1.55}

/* hoja de retroalimentación */
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:subir .22s ease-out;max-height:82vh;overflow:auto;border-top:2px solid transparent}
.hoja.ok{background:var(--ok-cl);color:var(--ok-tx);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.hoja.mal{background:var(--mal-cl);color:var(--mal-tx);border-color:color-mix(in srgb,var(--mal) 35%,transparent)}
.hoja.parcial{background:var(--xp-cl);color:var(--xp-tx);border-color:color-mix(in srgb,var(--xp) 45%,transparent)}
.hoja-in{max-width:720px;margin:0 auto}
.hoja-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hoja-h b{font-size:20px;font-weight:800}
.hoja-ico{width:38px;height:38px;border-radius:50%;background:var(--sup);display:grid;place-items:center;font-size:20px;font-weight:900;flex-shrink:0}
.hoja.ok .hoja-ico{color:var(--ok)} .hoja.mal .hoja-ico{color:var(--mal)} .hoja.parcial .hoja-ico{color:var(--xp-o)}
.xp-pop{font-size:13px;font-weight:800;background:var(--xp);color:#1c1405;padding:3px 9px;border-radius:99px;animation:pop .35s}
.combo-pop{font-size:13px;font-weight:800;color:var(--fuego)}
.hoja-sol{margin-top:12px;font-size:15px}
.hoja-sol .sol-t{font-weight:700}
.sol-lista{margin:4px 0 0 20px;display:grid;gap:3px;font-size:14.5px;font-weight:600}
ul.sol-lista{list-style:disc}
.sol-lista li.ok{opacity:.65}
.sol-lista li.falta{font-weight:800}
.sol-lista li.falta::after{content:' ← te faltó';font-weight:600;font-size:12px;opacity:.8}
.sol-cubs p{font-size:14px;margin-top:4px}
.sol-nota{font-style:italic;opacity:.85}
.hoja-pq{margin-top:12px;background:color-mix(in srgb,var(--sup) 60%,transparent);border-radius:12px;padding:10px 13px}
.hoja-pq b{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}
.hoja-pq p{font-size:14px;line-height:1.5}
.hoja-prox{font-size:13px;margin-top:10px;opacity:.9}
.hoja .btn3d{margin-top:16px}

/* fin de sesión */
.fin-ses{max-width:520px;margin:0 auto;padding:36px 18px 40px;text-align:center}
.fin-trofeo{font-size:64px}
.fin-ses h1{margin-top:8px}
.fin-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 16px}
@media(max-width:460px){.fin-stats{grid-template-columns:repeat(2,1fr)}}
.fs{border:2px solid var(--linea);border-radius:14px;overflow:hidden;background:var(--sup)}
.fs small{display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px;color:var(--on)}
.fs b{display:block;font-size:19px;font-weight:800;padding:8px 4px}
.fs.xp small{background:var(--xp);color:#1c1405} .fs.ok small{background:var(--ok)} .fs.t small{background:var(--azul)} .fs.fu small{background:var(--fuego)}
.fin-meta{display:flex;gap:14px;align-items:center;text-align:left;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:14px}
.fin-meta p{font-size:13px;color:var(--tx2)}
.fin-logros{margin-top:16px;text-align:left}
.fin-logros h3{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2);margin-bottom:8px}
.logro-nuevo{display:flex;gap:12px;align-items:center;background:var(--xp-cl);border:2px solid color-mix(in srgb,var(--xp) 45%,transparent);border-radius:14px;padding:10px 14px;margin-bottom:8px;animation:pop .4s}
.logro-nuevo span{font-size:28px}
.logro-nuevo b{display:block;color:var(--xp-tx)} .logro-nuevo small{color:var(--xp-tx);opacity:.8}
.fin-ses .btn3d{margin-top:22px}

/* ===== práctica ===== */
.sel-u{display:flex;align-items:center;gap:10px;margin:18px 0 14px;font-size:14px;font-weight:700;color:var(--tx2)}
.sel-u select{flex:1;max-width:320px;background:var(--sup);color:var(--tx);border:2px solid var(--linea2);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.modos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.modo{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:5px;border-radius:var(--r);padding:16px;text-align:left;cursor:pointer;display:grid;gap:4px;transition:transform .1s,border-color .15s}
.modo:hover:not(:disabled){border-color:var(--verde)}
.modo:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.modo:disabled{opacity:.45;cursor:default}
.modo-ico{font-size:26px}
.modo b{font-size:16px;font-weight:800}
.modo small{font-size:12.5px;color:var(--tx2);line-height:1.45}
.modo i{font-style:normal;font-size:11px;font-weight:700;color:var(--tx3);margin-top:2px}

/* ===== perfil ===== */
.nivel-card{display:flex;gap:16px;align-items:center;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:18px}
.nivel-badge{width:64px;height:64px;border-radius:18px;background:var(--xp);color:#1c1405;font-size:28px;font-weight:900;display:grid;place-items:center;
  box-shadow:0 4px 0 var(--xp-o);flex-shrink:0;rotate:-4deg}
.nivel-txt{flex:1}
.nivel-txt small{font-size:12px;color:var(--tx2);font-weight:700}
.nivel-txt b{display:block;font-size:20px;font-weight:800;margin-bottom:6px}
.nivel-txt .barra{margin-bottom:4px}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media(max-width:520px){.cifras{grid-template-columns:repeat(2,1fr)}}
.cifra{background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:12px 8px;text-align:center}
.cifra b{display:block;font-size:19px;font-weight:800}
.cifra span{display:block;font-size:11px;color:var(--tx2);font-weight:700;margin-top:2px}
.logros{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.logro{text-align:center;padding:12px 6px;border-radius:14px;border:2px solid color-mix(in srgb,var(--xp) 45%,transparent);background:var(--xp-cl);display:grid;gap:2px;align-content:start}
.logro-ico{font-size:28px}
.logro b{font-size:12.5px;font-weight:800;color:var(--xp-tx);line-height:1.25}
.logro small{font-size:10.5px;color:var(--xp-tx);opacity:.8;line-height:1.3}
.logro.bloq{background:var(--sup);border-color:var(--linea)}
.logro.bloq .logro-ico{filter:grayscale(1);opacity:.35}
.logro.bloq b,.logro.bloq small{color:var(--tx3)}
.temas{display:grid;gap:8px}
.tema{background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:12px 14px}
.tema-h{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:8px}
.tema-h b{flex:1;font-weight:800}
.tema-h i{font-style:normal;font-size:12.5px;font-weight:800;color:var(--tx2)}
.tema small{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--tx2);margin-top:6px}
.tema small .estrellas{font-size:12px;margin:0}
.graf{display:flex;align-items:flex-end;gap:3px;height:84px;background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:10px}
.graf .col{flex:1;height:100%;display:flex;align-items:flex-end}
.graf .col i{display:block;width:100%;min-height:3px;background:var(--xp);border-radius:4px}
.graf.fut .col i{background:var(--mag)}
.calib-box{background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.calib-num b{display:block;font-size:30px;font-weight:900;color:var(--azul)}
.calib-num span{font-size:11.5px;color:var(--tx2)}
.calib-det{flex:1;min-width:180px}
.calib-det p{font-size:13px;margin-bottom:4px}
.calib-det small{color:var(--tx2)}
.ajuste-t{font-size:13px;font-weight:800;margin:14px 0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:12px;padding:8px 6px;cursor:pointer;text-align:center}
.seg button b{display:block;font-size:14px;font-weight:800}
.seg button small{display:block;font-size:11px;color:var(--tx2)}
.seg button.on{border-color:var(--azul);background:var(--azul-cl)}
.seg button.on b{color:var(--azul)}
.principios{display:grid;gap:8px}
.principios details{background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:12px 14px}
.principios summary{cursor:pointer;font-size:14.5px;list-style-position:outside}
.principios details p{font-size:13.5px;color:var(--tx2);margin-top:8px;line-height:1.55}
.micro code{background:var(--sup2);padding:1px 5px;border-radius:5px;font-size:11.5px}
.marca{background:var(--mag-cl);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;line-height:1.55}
.marca .btn{margin-top:8px}

/* ===== mapa ===== */
.mapa{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:18px;margin-top:20px;align-items:start}
@media(max-width:700px){.mapa{grid-template-columns:1fr}.figura{max-width:420px;margin:0 auto;width:100%}}
.figura{background:radial-gradient(ellipse at 50% 35%,var(--sup2),var(--sup) 70%);border:2px solid var(--linea);border-radius:var(--r);padding:12px;position:sticky;top:64px}
@media(max-width:700px){.figura{position:static}}
.vistas-mapa{margin-bottom:6px}
.lienzo svg{width:auto;max-width:100%;height:auto;max-height:76vh;margin:0 auto;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.lienzo{position:relative}
.zoom-bot{position:absolute;right:4px;top:4px;display:flex;flex-direction:column;gap:4px;z-index:2}
.zoom-bot button{width:34px;height:34px;border-radius:10px;border:2px solid var(--linea);background:var(--sup);color:var(--tx);font:800 18px/1 system-ui;cursor:pointer;opacity:.9}
.zoom-bot button:hover{background:var(--sup2)}
.lienzo.ampliada svg{cursor:grab;outline:2px solid color-mix(in srgb,var(--verde) 40%,transparent);border-radius:10px}
.lamina .sil-base{fill:#6a1c16}
.lamina .sil-borde{fill:none;stroke:rgba(30,5,3,.55);stroke-width:1}
.lamina .f .piel{stroke:rgba(40,6,4,.55);stroke-width:.6;stroke-linejoin:round}
.lamina .f.k-b .piel{stroke:rgba(120,100,70,.7)}
.lamina .f.k-t .piel{stroke:rgba(130,110,80,.5)}
.lamina .f.k-g .piel{stroke:rgba(90,60,50,.35)}
.lamina .f.k-g{filter:none}
.lamina .f .tex{pointer-events:none}
.lamina [data-toca]{cursor:pointer;transition:filter .2s}
.lamina .f.k-h{display:none;pointer-events:none}
.lamina .f.k-h .piel{fill:rgba(255,209,102,.28);stroke:#ffd166;stroke-width:1.4;stroke-dasharray:4 3}
.lamina .f.k-h.foco{display:inline;pointer-events:auto}
.lamina.hay-sel [data-toca]:not(.sel):not(.foco){filter:saturate(.45) brightness(.72)}
.lamina .f.sel{filter:brightness(1.18) saturate(1.2)}
.lamina .f.sel .piel{stroke:#ffd166;stroke-width:1.1}
.lamina .f.hover{filter:brightness(1.25)}
.lamina .f.foco{filter:brightness(1.3) saturate(1.25) drop-shadow(0 0 3px #ffd166)}
.lamina .f.foco .piel{stroke:#fff6d5;stroke-width:1.6}
.lamina .f.foco:not(.k-h){animation:latirM 1.1s ease-in-out 2}
.lamina .f.acierto .piel{stroke:#4ade80;stroke-width:2}
.lamina .f.error-m{filter:sepia(1) hue-rotate(-40deg) saturate(3) brightness(.9)}
.lamina .lam-rot{font:700 11px system-ui,sans-serif;fill:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
@keyframes latirM{50%{filter:brightness(1.55) saturate(1.3) drop-shadow(0 0 6px #ffd166)}}
html[data-fx="suaves"] .lamina .f.foco{animation:none}
.mapa-cap{min-height:22px;text-align:center;font-size:14px;margin-top:6px}
.mapa-cap b{font-weight:800}
.mapa-cap .obj-cap{color:var(--xp-o);font-size:16px}
.mapa-ley{font-size:11px;color:var(--tx3);text-align:center;margin-top:2px}
.reg-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip-reg{font:inherit;font-size:12.5px;font-weight:700;border:2px solid var(--linea);background:var(--sup2);color:var(--tx2);border-radius:99px;padding:5px 11px;cursor:pointer}
.chip-reg.vista{border-color:color-mix(in srgb,var(--verde) 45%,var(--linea))}
.chip-reg.on{background:var(--verde);border-color:var(--verde);color:#fff}
.grupo li.senalable{cursor:pointer;display:flex;align-items:center;gap:6px}
.grupo li.senalable::after{content:'◉';margin-left:auto;font-size:11px;color:var(--tx3)}
.grupo li.senalable:hover{background:var(--sup3)}
.grupo li.marcado{outline:2px solid #e0b43c;background:color-mix(in srgb,#ffd166 18%,var(--sup2))}
.prof-tag{font-size:10.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.juego-m{text-align:center;padding:8px 0}
.juego-n{font-size:12.5px;font-weight:800;color:var(--tx2)}
.juego-p{margin-top:14px;color:var(--tx2)}
.juego-obj{font-size:24px;font-weight:900;margin:6px 0 10px;color:var(--xp-o)}
.juego-m .fila{justify-content:center}
.mapa-cont{font-size:11.5px;color:var(--tx2);text-align:center;margin-top:8px;font-weight:700}
.detalle{background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:18px}
.detalle h3{font-size:19px;font-weight:800;margin-bottom:12px}
.grupo{margin-bottom:14px}
.grupo h4{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--verde);margin-bottom:6px}
.grupo ul{list-style:none;display:grid;gap:4px}
.grupo li{font-size:14px;background:var(--sup2);padding:7px 11px;border-radius:9px}
.grupo ul.oculto li{color:transparent;user-select:none;text-shadow:0 0 9px var(--tx2)}

/* ===== apuntes ===== */
.buscador{width:100%;margin:16px 0 12px;background:var(--sup);border:2px solid var(--linea2);border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;color:var(--tx)}
.buscador:focus{outline:none;border-color:var(--azul)}
.nres{font-size:12px;color:var(--tx2);margin-bottom:10px}
.acord{background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.acord.open{border-color:var(--ac)}
.acord-h{width:100%;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.acord-h b{flex:1;font-size:15px;font-weight:800}
.acord-h i{font-style:normal;font-size:12px;color:var(--tx2)}
.acord-h .fl{font-size:18px;font-weight:800;color:var(--ac);width:16px;text-align:center}
.acord-b{padding:0 16px 14px;display:grid;gap:10px}
article.nota{background:var(--sup2);border:0;border-radius:12px;padding:13px 15px;text-align:left;cursor:default}
article.nota h4{font-size:14.5px;font-weight:800;margin-bottom:8px;line-height:1.4}
article.nota ul{list-style:none;display:grid;gap:4px}
article.nota li{font-size:14px;padding-left:14px;position:relative;line-height:1.45}
article.nota li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--ac,var(--verde))}
.pill{display:inline-block;font-size:10.5px;font-weight:700;color:var(--ok-tx);background:var(--ok-cl);padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:middle}
.pill.baja{color:var(--xp-tx);background:var(--xp-cl)}
.pq{font-size:12.5px;color:var(--tx2);margin-top:10px;line-height:1.55;padding-top:10px;border-top:1px solid var(--linea)}
.pq b{color:var(--ac,var(--verde))}

/* ===== fichas MAT 1 y Pre-Pilates ===== */
.foto-ej{margin:0 0 16px;background:#fff;border:2px solid var(--linea2);border-radius:16px;overflow:hidden;display:flex;justify-content:center}
.foto-ej img{display:block;width:100%;max-width:600px;height:auto;max-height:320px;object-fit:contain}
.pestanas{margin:16px 0 4px}
.pestanas button{min-width:0}
.grupo-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);margin:22px 0 8px}
.grupo-t i{font-style:normal;color:var(--tx3);margin-left:4px}
.ficha-ej,.ficha-pm{background:var(--sup);border:2px solid var(--linea);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ficha-ej[open],.ficha-pm[open]{border-color:var(--mag)}
.ficha-ej summary,.ficha-pm summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px}
.ficha-ej summary::-webkit-details-marker,.ficha-pm summary::-webkit-details-marker{display:none}
.ficha-ej summary b{font-size:15px;font-weight:800;margin-right:auto}
.ficha-ej dl,.ficha-pm dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;padding:0 14px 12px;font-size:13.5px;line-height:1.5}
.ficha-ej dt,.ficha-pm dt{font-weight:800;color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.ficha-ej dd ol{margin-left:18px}
@media(max-width:520px){.ficha-ej dl,.ficha-pm dl{grid-template-columns:1fr;gap:2px}.ficha-ej dd,.ficha-pm dd{margin-bottom:8px}}
.props{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}
@media(max-width:520px){.props{grid-template-columns:1fr}}
.props-col{background:var(--sup2);border-radius:12px;padding:10px 12px}
.props-col h5{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mag);margin-bottom:6px}
.props-col ul{margin-left:16px;display:grid;gap:4px;font-size:13px;line-height:1.45}
.nada{color:var(--tx3)}
.ficha-ej .pq,.ficha-pm .pq{margin:0 14px 12px}
.revisar{margin:0 14px 12px;background:var(--xp-cl);color:var(--xp-tx);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5}
.revisar b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.pill.gris{background:var(--sup2);color:var(--tx2)}
.pill.aviso-p{background:var(--xp-cl);color:var(--xp-tx)}
.ficha-pm summary{flex-wrap:nowrap}
.ficha-pm .mini{width:64px;height:44px;border-radius:8px;object-fit:cover;background:#fff;flex-shrink:0;border:1px solid var(--linea)}
.pm-t{display:grid;flex:1;min-width:0}
.pm-t b{font-size:14.5px;font-weight:800}
.pm-t small{font-size:12px;color:var(--tx2)}
.pm-fotos{display:flex;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.pm-fotos img{max-width:100%;max-height:220px;border-radius:10px;background:#fff;border:1px solid var(--linea)}

/* ===== avisos, toasts, confeti ===== */
div.aviso{position:fixed;left:16px;right:16px;bottom:96px;z-index:70;max-width:520px;margin:0 auto;
  background:var(--mal);color:#fff;padding:13px 16px;border-radius:14px;font-size:13px;line-height:1.5;box-shadow:0 8px 30px -8px rgba(0,0,0,.5)}
div.aviso button{background:rgba(255,255,255,.22);border:0;color:inherit;cursor:pointer;width:24px;height:24px;border-radius:7px;font-size:13px;float:right;margin-left:10px}
div.aviso.ok{background:var(--verde);color:var(--on)}
/* div.aviso: el aviso flotante; los ítems de revisión y las transiciones (li.aviso) van en su lista */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:80;background:var(--tx);color:var(--bg);
  padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;box-shadow:var(--sombra);
  animation:toastIn .25s ease-out,toastOut .3s ease-in 2.4s forwards;max-width:calc(100vw - 32px);text-align:center}
.toast-logro{background:var(--xp);color:#1c1405}
.confeti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:97}

/* ===== animaciones ===== */
@keyframes subir{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes sacudir{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-10px)}}
/* ---------- música y efectos (efectos.js) ---------- */
.btn-musica{background:none;border:2px solid var(--linea);color:var(--tx2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:15px;flex-shrink:0;display:grid;place-items:center;padding:0}
.btn-musica:hover{background:var(--sup2)}
.btn-musica .nota-off{display:none}
.btn-musica.off .nota-on{display:none}
.btn-musica.off .nota-off{display:inline}
.btn-musica:not(.off) .nota-on{animation:latir 1.6s ease-in-out infinite}
.ses-musica{border:0;width:32px;height:32px;font-size:16px;opacity:.75}
.ses-prog span.avanza::before{content:'';position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:brillo .7s ease-out}
.ses-combo.late{animation:pop .35s}
.ses-combo.fuego{text-shadow:0 0 10px color-mix(in srgb,var(--fuego) 70%,transparent)}
.fx-ok{animation:resplandor .7s ease-out}
.fx-mal{animation:sacudir .32s ease-in-out 2}
.ficha.aterriza{animation:aterrizar .3s cubic-bezier(.3,1.6,.5,1)}
.fx-capa{position:fixed;inset:0;pointer-events:none;z-index:95}
.chispa{position:absolute;width:var(--t);height:var(--t);margin:calc(var(--t) / -2) 0 0 calc(var(--t) / -2);border-radius:50%;background:var(--c);
  animation:chispa .75s cubic-bezier(.15,.7,.3,1) forwards}
.chispa.estrella{border-radius:0;clip-path:polygon(50% 0,61% 38%,100% 50%,61% 62%,50% 100%,39% 62%,0 50%,39% 38%)}
.flota{position:fixed;z-index:96;pointer-events:none;transform:translateX(-50%);font-weight:900;color:var(--xp-o);font-size:18px;animation:flotaArriba 1.1s ease-out forwards}
.cartel{position:fixed;left:50%;top:38%;z-index:94;pointer-events:none;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--sup);border:3px solid var(--fuego);border-radius:22px;padding:14px 26px;box-shadow:0 14px 40px rgba(0,0,0,.22);animation:cartel 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.cartel span{font-weight:900;font-size:20px;color:var(--fuego)}
.cartel .cartel-num{font-size:40px;line-height:1}
.cartel small{font-size:12px;font-weight:800;color:var(--tx2)}
.cartel.quieto{animation:fade .2s}
.fin-trofeo{position:relative;display:inline-grid;place-items:center;width:130px;height:110px}
.fin-trofeo .ico{position:relative;animation:pop .5s, flotar 2.6s ease-in-out .6s infinite}
.fin-trofeo .rayos{position:absolute;inset:-20px;border-radius:50%;opacity:.55;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--xp) 55%,transparent) 0 12deg,transparent 12deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 70%);mask:radial-gradient(circle,#000 25%,transparent 70%);animation:girar 14s linear infinite}
.logro-nuevo{position:relative;overflow:hidden}
.logro-nuevo.entra{animation:pop .4s}
.logro-nuevo.entra::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);animation:barrido .9s ease-out .1s}
.racha-sube{color:var(--fuego);display:inline-block;animation:pop .5s 1.1s both}
.fx-pum{display:inline-block;animation:pop .35s}
.toast-logro{overflow:hidden}
.toast-logro::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:barrido 1s ease-out .3s}
.sube-nivel{position:fixed;inset:0;z-index:92;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(3px);animation:fade .25s;cursor:pointer}
.sube-nivel.saliendo{opacity:0;transition:opacity .3s}
.sube-in{position:relative;text-align:center;padding:30px}
.sube-rayos{position:absolute;left:50%;top:84px;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--xp) 50%,transparent) 0 10deg,transparent 10deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:girar 10s linear infinite}
.sube-badge{position:relative;width:108px;height:108px;margin:0 auto 14px;border-radius:30px;display:grid;place-items:center;font-size:52px;font-weight:900;color:#1c1405;
  background:linear-gradient(145deg,#fde68a,var(--xp) 55%,#d97706);box-shadow:0 6px 0 #b45309,0 16px 40px rgba(217,119,6,.45);animation:insignia .8s cubic-bezier(.2,1.5,.4,1)}
.sube-t{position:relative;font-size:24px;font-weight:900}
.sube-n{position:relative;font-size:17px;font-weight:800;color:var(--xp-o);margin-top:4px}
.sube-toca{position:relative;font-size:12px;color:var(--tx3);margin-top:18px}
.atenuado{opacity:.45}
.rango{display:flex;flex-direction:column;gap:6px}
.rango input{width:100%;max-width:340px;accent-color:var(--ok)}
kbd{font:700 12px/1 ui-monospace,monospace;border:1px solid var(--linea);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--sup2)}
html[data-fx="suaves"] .chispa,html[data-fx="suaves"] .sube-rayos,html[data-fx="suaves"] .fin-trofeo .rayos{display:none}
html[data-fx="suaves"] .fx-mal,html[data-fx="suaves"] .fx-ok,html[data-fx="suaves"] .ficha.aterriza,html[data-fx="suaves"] .btn-musica .nota-on,
html[data-fx="suaves"] .fin-trofeo .ico,html[data-fx="suaves"] .sube-badge,html[data-fx="suaves"] .ses-prog span.avanza::before{animation:none}
@keyframes chispa{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 24px)) rotate(var(--r)) scale(.2);opacity:0}}
@keyframes flotaArriba{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
@keyframes cartel{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(.95)}}
@keyframes resplandor{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent);border-radius:16px}100%{box-shadow:0 0 0 18px transparent;border-radius:16px}}
@keyframes aterrizar{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes brillo{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes barrido{to{left:120%}}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes insignia{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
/* ===== figura articulada (figura.js) ===== */
.fig-svg{width:100%;height:auto;display:block}
.fig-mat{fill:var(--mat,#7b6de0)}
.fig-mat-sombra{fill:rgba(0,0,0,.18)}
.fig-mat-arriba{fill:var(--mat,#7b6de0);opacity:.28}
.fig-mat-persp{fill:var(--mat,#7b6de0);opacity:.32}
.fig-cam{font:700 8.5px system-ui,sans-serif;fill:var(--tx3);letter-spacing:.04em;text-transform:uppercase}
.fig-silla{fill:#9b8b7a}
.fig-fantasma{opacity:.12}
.fig-mat-raya{stroke:rgba(255,255,255,.35);stroke-width:.6}
.fig-sombra{fill:rgba(0,0,0,.28)}
.fig-ej{background:var(--sup2);border-radius:14px;margin-bottom:12px;padding:4px 6px;max-width:520px;margin-inline:auto}
/* ===== repertorio con animación ===== */
.pestanas{overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{flex:0 0 auto;white-space:nowrap}
.filtros-rep{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.ficha-rep{background:var(--sup);border:2px solid var(--linea);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ficha-rep[open]{border-color:var(--mag)}
.ficha-rep>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:8px 12px}
.ficha-rep>summary::-webkit-details-marker{display:none}
.rep-mini{width:86px;flex-shrink:0;background:var(--sup2);border-radius:10px;padding:1px}
.rep-t{flex:1;min-width:0}
.rep-t b{display:block;font-size:15px;font-weight:800}
.rep-t small{font-size:12px;color:var(--tx2)}
.pill.osteo-evitar{background:var(--mal-cl);color:var(--mal-tx)}
.pill.osteo-apto{background:var(--ok-cl);color:var(--ok-tx)}
.pill.osteo-modificar{background:var(--xp-cl);color:var(--xp-tx)}
.rep-cuerpo{padding:0 14px 14px}
.rep-anim{background:var(--sup2);border-radius:14px;padding:6px;margin-bottom:10px}
.rep-fig{max-width:560px;margin:0 auto}
.rep-ctrl{display:flex;justify-content:center;gap:8px;margin:2px 0 6px}
.rep-ctrl .btn{min-width:46px}
.rep-fase{min-height:44px;padding:0 4px;font-size:14px;line-height:1.45}
.rep-fase .fase-chip{display:inline-block;margin:0 6px 4px 0;vertical-align:1px}
.rep-fase p{display:inline}
.fase-chip{flex-shrink:0;font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:99px;background:var(--sup3);color:var(--tx2)}
.fase-chip.inhala{background:#dbeafe;color:#1d4ed8}
.fase-chip.exhala{background:#ffedd5;color:#c2410c}
.fase-chip.ambas{background:#ede9fe;color:#6d28d9}
.fase-chip.ini{background:var(--sup3);color:var(--tx)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* visor de animación: paso a paso, deslizador, velocidad y capas */
.visor{background:var(--sup2);border-radius:14px;padding:6px 6px 8px;margin-bottom:10px}
.visor .rep-fig{max-width:560px;margin:0 auto}
.visor-tl{display:block;position:relative;margin:4px 10px 2px;height:26px}
.visor-tl input{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--mag);background:transparent;cursor:pointer}
.tl-marcas{position:absolute;left:8px;right:8px;top:50%;height:0;pointer-events:none}
.tl-marcas i{position:absolute;top:-7px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--linea2)}
.visor .rep-ctrl{flex-wrap:wrap;align-items:center}
.vel{display:inline-flex;gap:2px;background:var(--sup3);border-radius:99px;padding:2px;margin-left:4px}
.chip-vel{border:0;background:transparent;color:var(--tx2);font:inherit;font-size:12.5px;font-weight:800;min-width:38px;min-height:32px;border-radius:99px;cursor:pointer}
.chip-vel.on{background:var(--sup);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip-vel[data-ritmo]{padding:0 11px}
.visor-capas{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:4px 0 6px}
.chip-capa{border:1.5px solid var(--linea2);background:var(--sup);color:var(--tx2);font:inherit;font-size:12.5px;font-weight:700;padding:6px 10px;min-height:34px;border-radius:99px;cursor:pointer}
.chip-capa.on{border-color:var(--mag);color:var(--tx);background:var(--mag-cl)}
.visor-modo{display:flex;gap:3px;background:var(--sup3);border-radius:99px;padding:3px;margin:2px auto 8px;width:max-content;max-width:100%}
.visor-modo button{border:0;background:transparent;color:var(--tx2);font:inherit;font-size:13px;font-weight:800;padding:7px 12px;min-height:36px;border-radius:99px;cursor:pointer}
.visor-modo button[aria-pressed="true"]{background:var(--sup);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.visor-modo small{font-weight:700;color:var(--tx2);margin-left:2px}
.visor-fotos{display:grid;gap:10px;padding:2px 4px}
.vf-prop h5{margin:0 0 3px;font-size:14px}.vf-prop p{margin:0 0 6px;font-size:13px;color:var(--tx2);line-height:1.45}
.vf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.vf-foto{border:0;padding:0;background:var(--sup3);border-radius:10px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3}
.vf-foto img{width:100%;height:100%;object-fit:cover;display:block}
.vf-foto:focus-visible,.visor-modo button:focus-visible{outline:3px solid var(--mag);outline-offset:2px}
.vf-obs{font-size:13px;color:var(--tx2);margin:0;line-height:1.45}
dialog.foto-grande{border:0;padding:0;background:transparent;max-width:min(96vw,1000px)}
dialog.foto-grande::backdrop{background:rgba(0,0,0,.8)}
dialog.foto-grande img{max-width:100%;max-height:82vh;display:block;border-radius:10px}
dialog.foto-grande p{color:#fff;margin:8px 2px 0;font-size:14px}
.fg-cerrar{position:absolute;top:8px;right:8px;min-width:40px;min-height:40px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;cursor:pointer}
.visor-tira{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 2px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.tira-p{flex:0 0 92px;scroll-snap-align:start;position:relative;border:2px solid transparent;background:var(--sup);border-radius:10px;padding:0;cursor:pointer;overflow:hidden}
.tira-p .fig-svg{display:block}
.tira-p b{position:absolute;left:4px;top:3px;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--sup3);color:var(--tx)}
.tira-p.inhala b{background:#dbeafe;color:#1d4ed8}.tira-p.exhala b{background:#ffedd5;color:#c2410c}.tira-p.ambas b{background:#ede9fe;color:#6d28d9}
.tira-p.on{border-color:var(--mag)}
.tray{fill:none;stroke-width:1.6;stroke-dasharray:3 2.4;stroke-linecap:round;opacity:.9}
.tray-flecha{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tray-mano{stroke:#e11d48}.tray-pie{stroke:#2563eb}.tray-cab{stroke:#c026d3}.tray-pel{stroke:#f59e0b}
.fis-plomada{stroke-width:1;stroke-dasharray:2 2}
.fis-cm{stroke-width:1.2}
.fis-cruz{stroke-width:1}
.fis-ok .fis-plomada,.fis-ok .fis-cm,.fis-ok .fis-cruz{stroke:#15803d}.fis-ok .fis-cm{fill:#dcfce7}.fis-ok .fis-base{fill:#22c55e}
.fis-fuera .fis-plomada,.fis-fuera .fis-cm,.fis-fuera .fis-cruz{stroke:#c2410c}.fis-fuera .fis-cm{fill:#ffedd5}.fis-fuera .fis-base{fill:#f97316}
.fis-base{opacity:.75}
.fis-piso path{fill:none;stroke:#2563eb;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.fis-piso circle{fill:#2563eb}.fis-piso.fuera path{stroke:#c2410c}.fis-piso.fuera circle{fill:#c2410c}
.fis-base3d{stroke-width:3;stroke-linecap:round;opacity:.75}.fis-ok .fis-base3d{stroke:#22c55e}.fis-fuera .fis-base3d{stroke:#f97316}
.fig-mat-3d{fill:var(--mat,#7b6de0);opacity:.42}
.fig-3d svg{touch-action:pan-y;cursor:grab}.fig-3d svg:active{cursor:grabbing}
.rep-fig.fig-3d{position:relative}.rep-fig.fig-3d::after{content:'↔ arrastrá para girar';position:absolute;right:8px;bottom:4px;font:600 11px system-ui,sans-serif;color:var(--tx3);pointer-events:none}
.modal-visor .modal-in{max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto}
.ver-pasos{display:block;margin:6px auto 8px}
.ses-ilus{float:right;width:118px;margin:0 0 6px 10px;border-radius:10px;overflow:hidden;background:var(--sup2);aspect-ratio:16/10}
.ses-ilus img{width:100%;height:100%;object-fit:contain;background:#fff}.ses-ilus .fig-svg{width:100%;height:100%}
.ses-ej{clear:both}
.dia-card{display:flex;gap:12px;align-items:center;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:10px 12px;margin:0 0 16px;box-shadow:var(--sombra)}
.dia-fig{width:46%;max-width:240px;flex-shrink:0;background:var(--sup2);border-radius:12px;overflow:hidden}
.dia-txt{min-width:0}
.dia-txt small{display:block;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mag)}
.dia-txt b{display:block;font-size:17px;line-height:1.2;margin:2px 0 4px}
.dia-txt p{font-size:13px;color:var(--tx2);line-height:1.35;margin-bottom:8px}
/* chips de ejercicios con miniatura (regresiones, progresiones) */
.chips-ej{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.chip-ej{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--linea);background:var(--sup);color:var(--tx);font:inherit;font-size:13px;font-weight:600;line-height:1.2;padding:3px 9px 3px 3px;border-radius:10px;cursor:pointer;text-align:left}
.chip-ej.sin{padding-left:9px;cursor:default;opacity:.85;border-style:dashed}
.chip-ej:not(.sin):hover{border-color:var(--mag)}
.ce-img{width:44px;height:30px;border-radius:7px;overflow:hidden;background:var(--sup2);flex-shrink:0;display:grid;place-items:center}
.ce-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.ce-img .fig-svg{width:100%;height:100%}
.grupo-chips{margin-bottom:6px}
.grupo-chips>small{display:block;color:var(--tx2);font-weight:700;font-size:12px;margin-bottom:2px}
/* familias por posición */
.familia{background:var(--sup);border:1px solid var(--linea);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.familia>summary{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;list-style:none}
.familia>summary::-webkit-details-marker{display:none}
.familia>summary .gp-fig{width:74px;flex-shrink:0;background:var(--sup2);border-radius:8px;overflow:hidden}
.familia>summary b{font-size:16px}
.fam-cuenta{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.fam-cuenta i{font-style:normal;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:99px}
.lb-pre{--lb:#0d9488}.lb-mat1{--lb:#2563eb}.lb-mat2{--lb:#c026d3}
.fam-cuenta i{background:color-mix(in srgb,var(--lb) 15%,transparent);color:var(--lb)}
.fam-libro{margin:10px 12px 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--lb);border-bottom:2px solid color-mix(in srgb,var(--lb) 35%,transparent);padding-bottom:3px}
.fam-sub{margin:6px 12px 4px;font-size:12.5px;color:var(--tx2)}
.fam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:0 12px 10px}
.fam-ej{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--linea);background:var(--bg);color:var(--tx);font:inherit;border-radius:12px;padding:5px;cursor:pointer;min-width:0}
.fam-ej:not(.sin):hover{border-color:var(--mag)}
.fam-ej.sin{cursor:default}
.fe-img{aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--sup2);display:grid;place-items:center}
.fe-img img{width:100%;height:100%;object-fit:cover}
.fe-img .fig-svg{width:100%;height:100%}
.fe-nada{font-size:11px;color:var(--tx3)}
.fam-ej b{font-size:13px;line-height:1.25}
.fam-ej small{font-size:11.5px;color:var(--tx2);line-height:1.3}
/* armá tu clase: miniaturas */
.cl-mini{width:46px;height:32px;border-radius:7px;overflow:hidden;background:var(--sup2);flex-shrink:0;display:grid;place-items:center}
.cl-mini img{width:100%;height:100%;object-fit:cover}
.cl-mini .fig-svg{width:100%;height:100%}
.vm-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.vm-cab h3{margin:0;font-size:18px}
.visor.grande .rep-fig{max-width:720px}
.visor.grande .rep-fase{font-size:15.5px;min-height:52px}
.rep-pasos{margin:0 0 10px 0;padding:0;list-style:none;counter-reset:p}
.rep-pasos li{font-size:14px;line-height:1.45;padding:7px 10px 7px 34px;border-radius:10px;position:relative;cursor:pointer}
.rep-pasos li::before{counter-increment:p;content:counter(p);position:absolute;left:8px;top:7px;width:20px;height:20px;border-radius:50%;background:var(--sup3);font-size:11px;font-weight:800;display:grid;place-items:center}
.rep-pasos li:first-child::before{content:'0';counter-increment:none}
.rep-pasos li b{font-weight:800;margin-right:4px}
.rep-pasos li.on{background:color-mix(in srgb,var(--mag) 14%,transparent)}
.rep-pasos li.on::before{background:var(--mag);color:#fff}
.ficha-rep dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;font-size:13.5px;line-height:1.5}
.ficha-rep dt{font-weight:800;color:var(--tx2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
.ficha-rep dd ul{margin-left:16px}
@media(max-width:520px){.ficha-rep dl{grid-template-columns:1fr}.ficha-rep dt{padding-top:6px}}
.osteo-li.osteo-evitar b{color:var(--mal-tx)}.osteo-li.osteo-apto b{color:var(--ok-tx)}
.rep-analisis{margin-top:12px}
.rep-analisis h5{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);margin-bottom:6px}
.pag-manual{font-size:12.5px;color:var(--tx2);margin-top:10px;font-weight:600}
.hoja-pag{font-size:12.5px;opacity:.85;margin:-2px 0 10px;font-weight:600}
/* ===== manual ===== */
.seccion-bb{background:var(--sup);border:2px solid var(--linea);border-radius:14px;margin-bottom:8px}
.seccion-bb>summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;padding:12px 14px}
.seccion-bb>summary::-webkit-details-marker{display:none}
.seccion-bb>summary b{font-size:15px;font-weight:800}
.seccion-bb>summary small{font-size:12px;color:var(--tx2)}
.seccion-bb[open]{border-color:var(--verde)}
.sec-cuerpo{padding:0 14px 14px;font-size:14px;line-height:1.55}
.sec-res{margin-bottom:10px}
.sec-puntos{margin:6px 0 0 18px;display:grid;gap:4px}
.notas-mano{border-style:dashed}
.notas-mano p{margin-bottom:8px}
.tabla-mus{display:grid;gap:10px;margin-top:12px}
.tm-g{background:var(--sup2);border-radius:12px;padding:10px 12px}
.tm-g h5{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);margin-bottom:6px}
.tm-g dl{display:grid;grid-template-columns:minmax(90px,max-content) 1fr;gap:4px 10px;font-size:13px}
.tm-g dt{font-weight:700;color:var(--tx2)}
/* ===== posiciones ===== */
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pos-card{background:var(--sup);border:2px solid var(--linea);border-radius:14px;padding:6px 6px 10px}
.pos-card .fig-svg{background:var(--sup2);border-radius:10px}
.pos-card figcaption{padding:6px 6px 0;display:flex;flex-direction:column;gap:2px}
.pos-card b{font-size:14px;font-weight:800}
.pos-card small{font-size:12.5px;color:var(--tx2);line-height:1.4}
.pos-card i{font-size:11.5px;font-style:normal;color:var(--mag);font-weight:700}
.ficha-pm .mini-fig{display:block;background:var(--sup2);padding:1px;overflow:hidden}
.ficha-pm .mini-fig .fig-svg{width:100%;height:100%}
.grupo-pos{display:flex;align-items:center;gap:8px}
.gp-fig{width:74px;display:inline-block;background:var(--sup2);border-radius:8px}
/* ===== diagramas del manual ===== */
.diag{background:var(--sup2);border-radius:14px;padding:10px;margin:12px 0}
.diag figcaption{font-size:13px;font-weight:800;margin-bottom:6px}
.diag-bot{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dg-lienzo{max-width:520px;margin:0 auto}
.dg{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}
.dg-cap{font-size:13.5px;line-height:1.45;min-height:38px;margin-top:4px}
.diag-pie{font-size:12.5px;color:var(--tx2);line-height:1.45;margin-top:6px}
.dg-slider{width:100%;max-width:420px;display:block;margin:4px auto;accent-color:var(--verde)}
.dg-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dg-celda{background:var(--sup);border-radius:10px;padding:4px 6px 8px;display:flex;flex-direction:column;gap:2px}
.dg-celda b{font-size:13px;font-weight:800}.dg-celda small{font-size:12px;color:var(--tx2);line-height:1.35}
.dg-orden{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.dg-paso{width:120px;background:var(--sup);border-radius:10px;padding:2px 4px 6px;text-align:center}
.dg-paso b{font-size:11.5px;font-weight:800}
.dg-sig{color:var(--tx3);font-weight:900}
.dg-leyenda{font-size:12px;color:var(--tx2);text-align:center;margin-top:2px}
.ley{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-weight:900;font-size:10px;margin:0 2px 0 8px}
.ley.tenso{background:#dc2626}.ley.debil{background:#2563eb}
.dg-t{font:700 11px system-ui,sans-serif;fill:var(--tx)}
.dg-mini{font:600 9px system-ui,sans-serif;fill:var(--tx2)}
.dg-nodo{fill:var(--sup);stroke:var(--verde);stroke-width:2}
.dg-flecha{fill:none;stroke:var(--tx3);stroke-width:2}
.dg-flecha-c{fill:none;stroke:#e11d48;stroke-width:2.5}
.dg-punta{fill:var(--tx3)}
.dg-plomada{stroke:#e11d48;stroke-width:1.6;stroke-dasharray:5 4}
.dg-plomada.fina{stroke-width:1;opacity:.7}
.dg-horiz{stroke:#2563eb;stroke-width:1.4;stroke-dasharray:4 3}
.dg-pto{cursor:pointer}
.dg-pto-c{fill:#e11d48;stroke:#fff;stroke-width:1.5}
.dg-pto.on .dg-pto-c{fill:#f59e0b}
.dg-pto.on .dg-horiz{stroke:#f59e0b;stroke-width:2.4}
.dg-pto-n{font:900 8px system-ui,sans-serif;fill:#fff;pointer-events:none}
.dg-hueso{fill:#efe4cc;stroke:#a8946a;stroke-width:1}
.dg-hueso.pelvis{fill:#f3e9d2}
.dg-hueso.cerv{fill:#dbeafe}.dg-hueso.tor{fill:#fef3c7}.dg-hueso.lum{fill:#fee2e2}
.dg-hueso.craneo{fill:#f5efe0}
.dg-femur{stroke:#cbb88f;stroke-width:12;stroke-linecap:round}
.dg-cabeza-fem{fill:#e3d3ad;stroke:#a8946a}
.dg-tazon{fill:rgba(255,255,255,.35);stroke:#64748b;stroke-width:1.5}
.dg-agua{fill:#60a5fa;opacity:.75}
.dg-plano{stroke:#16a34a;stroke-width:2.5}
.dg-pierna{fill:none;stroke:#2f8f8a;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.dg-rotula{fill:#efe4cc;stroke:#a8946a}
.dg-pie{stroke:#f1c9a5;stroke-width:6;stroke-linecap:round}
.dg-pierna-sil{fill:#2f8f8a;opacity:.85}
.dg-talon{fill:#f1c9a5}
.dg-piso{stroke:var(--mat,#7b6de0);stroke-width:4;stroke-linecap:round}
.dg-torso{fill:#2f8f8a;opacity:.3}
.dg-escapula{fill:#efe4cc;stroke:#a8946a;stroke-width:1.2}
.dg-escapula.alada{fill:#fde68a}
.dg-borde{stroke:#e11d48;stroke-width:3}
.dg-cruz{stroke-width:3;stroke-linecap:round}
.dg-cruz.tenso{stroke:#dc2626}.dg-cruz.debil{stroke:#2563eb;stroke-dasharray:6 4}
.dg-cruz-c.tenso{fill:#dc2626;stroke:#fff;stroke-width:1.5}.dg-cruz-c.debil{fill:#2563eb;stroke:#fff;stroke-width:1.5}
.dg-escalon{fill:var(--sup);stroke:var(--linea2);stroke-width:1.5}
.dg-escalon.e0{fill:color-mix(in srgb,#dc2626 16%,var(--sup))}.dg-escalon.e3{fill:color-mix(in srgb,#16a34a 18%,var(--sup))}
.dg-fo{font:600 8.5px/1.25 system-ui,sans-serif;color:var(--tx);text-align:center}
.dg-escalera{display:flex;align-items:flex-end;gap:6px;max-width:520px;margin:0 auto}
.dg-esc{flex:1;min-height:var(--h);border-radius:10px 10px 4px 4px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;background:var(--sup);border:2px solid var(--linea)}
.dg-esc span{font-weight:900;font-size:16px;color:var(--tx3)}
.dg-esc b{font-size:12px;line-height:1.2}
.dg-esc i{font-size:11.5px;color:var(--tx2);line-height:1.25}
.dg-esc.e0{border-color:#dc2626}.dg-esc.e3{border-color:#16a34a}
.dg-fo b{display:block;font-weight:800;margin-bottom:2px}.dg-fo i{color:var(--tx2)}
/* ===== tus exámenes (datos-examenes.js) ===== */
.tag.examen{background:var(--azul-cl);color:var(--azul);text-transform:none;letter-spacing:0}
.tag.examen.fallada{background:var(--mal-cl);color:var(--mal-tx)}
.ex-notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 12px}
.ex-nota{background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:10px 12px;display:grid;gap:2px}
.ex-nota small{font-size:11.5px;color:var(--tx3);font-weight:700}
.ex-nota b{font-size:14.5px;font-weight:800;line-height:1.25}
.ex-pts{font-size:24px;font-weight:800;letter-spacing:-.02em}
.ex-pts i{font-style:normal;font-size:14px;color:var(--tx3)}
.ex-nota.media .barra span{background:var(--xp)}
.ex-nota.baja .barra span{background:var(--mal)}
.lecciones{list-style:none;display:grid;gap:8px}
.lecciones li{display:flex;gap:10px;background:var(--sup);border:2px solid var(--linea);border-radius:12px;padding:10px 12px}
.lecciones li>span{font-size:20px;line-height:1.2}
.lecciones b{display:block;font-size:14.5px;font-weight:800;line-height:1.35}
.lecciones small{display:block;font-size:12.5px;color:var(--tx2);margin-top:3px;line-height:1.45}
article.ex-rev{margin-bottom:10px}
.ex-rev h4{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ex-p{font-weight:800;color:var(--mal);white-space:nowrap}
.ex-rev.pendiente .ex-p{color:var(--tx3)}
.ex-q{font-weight:700;font-size:14.5px;line-height:1.4;margin:4px 0}
.ex-tu,.ex-ok,.ex-com{font-size:13.5px;line-height:1.45;margin-top:4px}
.ex-tu b{color:var(--mal)}
.ex-ok b{color:var(--ok)}
.ex-rev.pendiente .ex-ok b{color:var(--tx2)}
.ex-com{color:var(--tx2);font-style:italic}
.ex-rev .btn{margin:10px 6px 0 0}

/* ===== armá tu clase (clase.js) ===== */
.volver{background:none;border:0;color:var(--tx2);font-weight:700;font-size:14px;cursor:pointer;padding:4px 0;margin-bottom:6px}
.modo.destacado{width:100%;margin:18px 0 10px;border-color:color-mix(in srgb,var(--mag) 55%,transparent);background:var(--mag-cl)}
.modo.destacado i{color:var(--mag)}
.cl-lista{list-style:none;display:grid;gap:6px}
.cl-fila{display:flex;gap:10px;align-items:center;background:var(--sup);border:2px solid var(--linea);border-radius:12px;padding:8px 10px}
.cl-n{font-weight:800;color:var(--tx3);min-width:20px;text-align:right}
.cl-info{flex:1;min-width:0}
.cl-info b{display:block;font-size:14.5px;font-weight:800;line-height:1.25}
.cl-info small{font-size:12px;color:var(--tx2)}
.cl-pos{font-weight:700}
.cl-reps{display:flex;flex-direction:column;align-items:center}
.cl-reps input{width:62px;-moz-appearance:textfield;appearance:textfield;font:inherit;font-weight:800;text-align:center;border:2px solid var(--linea2);border-radius:10px;padding:4px;background:var(--bg);color:var(--tx)}
.cl-reps input:placeholder-shown{border-color:var(--xp);border-style:dashed}
.cl-reps input::placeholder{color:var(--tx2);opacity:1}
.cl-reps input::-webkit-inner-spin-button,.cl-reps input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.cl-reps small{font-size:10.5px;color:var(--tx3)}
.cl-mover{display:flex;flex-direction:column;gap:2px}
.cl-mover button{background:var(--sup2);border:0;border-radius:6px;width:28px;height:22px;cursor:pointer;font-size:12px;font-weight:800}
.cl-mover button:disabled{opacity:.3;cursor:default}
@media(min-width:520px){.cl-mover{flex-direction:row}}
.cl-trans{font-size:12.5px;color:var(--tx2);padding:0 8px 0 40px;line-height:1.4}
.cl-trans.aviso{color:var(--mal)}
.cl-trans i{font-style:normal;color:var(--tx3)}
.cl-acc{margin-top:12px}
.cl-pre{font-size:11px;text-transform:none;letter-spacing:0;color:var(--tx3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
/* ===== Mis sesiones (planes.js) ===== */
.pl-acc{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pl-lista{display:grid;gap:8px}
.pl-tarjeta{display:flex;gap:6px;align-items:stretch;background:var(--sup);border:2px solid var(--linea);border-radius:14px;overflow:hidden}
.pl-tarjeta.proxima{border-color:color-mix(in srgb,var(--verde) 55%,var(--linea))}
.pl-abrir{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 12px;cursor:pointer;color:var(--tx);font:inherit;display:grid;gap:2px}
.pl-abrir b{font-size:16px;font-weight:800}.pl-abrir small{color:var(--tx2);font-size:12.5px}
.pl-datos{font-size:13px;color:var(--tx2)}
.pl-focos{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.pl-focos i{font-style:normal;font-size:11.5px;font-weight:700;background:var(--sup3);border-radius:99px;padding:2px 8px}
.pl-mini-acc{display:flex;flex-direction:column;border-left:2px solid var(--linea)}
.pl-mini-acc button{flex:1;min-width:46px;background:none;border:0;cursor:pointer;font-size:16px;color:var(--tx2)}
.pl-mini-acc button+button{border-top:2px solid var(--linea)}
.pl-nombre input{width:100%;font:inherit;font-size:22px;font-weight:900;border:0;border-bottom:2px dashed var(--linea2);background:transparent;color:var(--tx);padding:6px 2px;margin:6px 0 10px}
.pl-campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.pl-campos label,.pl-notas{display:grid;gap:3px;font-size:12.5px;font-weight:800;color:var(--tx2)}
.pl-campos input,.pl-notas textarea,.pl-buscar input,.pl-extra select,.pl-extra input{font:inherit;font-size:14px;color:var(--tx);background:var(--sup);border:2px solid var(--linea2);border-radius:10px;padding:7px 9px;width:100%;min-width:0}
.pl-min{display:flex;align-items:center;gap:6px;font-weight:700}.pl-min input{width:80px}
.pl-notas{margin:6px 0 10px}.pl-notas textarea{resize:vertical;font-weight:500}
.pl-resumen{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--sup2);border-radius:12px;padding:9px 12px;font-size:14px}
.pl-aviso{color:var(--exhala-tx,#c2410c);font-weight:700}.pl-ok{color:var(--verde-o,var(--verde));font-weight:700}
.pl-extra{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center}
.pl-extra .pl-prop{flex:0 1 130px}.pl-extra .pl-nota{flex:1 1 140px}
.pl-extra select,.pl-extra input{padding:4px 7px;font-size:13px;border-radius:8px}
.pl-foto{border:2px solid var(--linea2);background:var(--sup);border-radius:8px;min-width:34px;min-height:30px;cursor:pointer}
.pl-buscar{display:block;margin-bottom:8px}
.pl-texto{display:grid;gap:10px}.pl-texto textarea{width:100%;font:inherit;font-size:13px;border:2px solid var(--linea2);border-radius:10px;padding:8px;background:var(--sup);color:var(--tx)}
@media (max-width:520px){.pl-fila{flex-wrap:wrap}.pl-fila .cl-info{flex-basis:calc(100% - 120px)}}
.chips button{background:var(--sup);border:2px solid var(--linea2);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer}
.chips button.on{border-color:var(--verde);background:var(--verde-cl);color:var(--verde-o)}
.cl-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.cl-ej{background:var(--sup);border:2px solid var(--linea2);border-bottom-width:4px;border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center}
.cl-ej:hover{border-color:var(--verde)}
.cl-ej .cl-pos{grid-row:span 2;font-size:20px}
.cl-ej b{font-size:13.5px;font-weight:800;line-height:1.25}
.cl-ej small{font-size:11.5px;color:var(--tx2)}

.ef-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;border-top:2px solid var(--linea);padding-top:12px}

.cl-res{margin-top:16px;background:var(--sup);border:2px solid var(--linea);border-radius:var(--r);padding:14px 16px}

.pt-dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:6px 0 10px;font-size:14.5px;line-height:1.45}
.pt-dl dt{font-weight:800}
.pt-dl dd small{color:var(--tx2)}
.pt-in h4{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--tx2);margin:12px 0 6px}
.pt-lista{padding-left:18px;display:grid;gap:5px;font-size:14px;line-height:1.45}
.pt-ejs{display:flex;flex-wrap:wrap;gap:6px}
.pt-ej{display:flex;align-items:center;gap:6px;border:1.5px solid var(--linea2);background:var(--sup);color:var(--tx);border-radius:12px;padding:4px 10px 4px 4px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;min-height:40px}

.prep-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}

.prep-barra{display:block;width:100%;height:7px;border-radius:99px;background:var(--sup3);overflow:hidden;margin-top:4px}

.prep-area{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--sup);border:2px solid var(--linea2);border-radius:14px;padding:9px 10px;cursor:pointer;color:var(--tx);font:inherit;font-size:13.5px;font-weight:800}
.prep-area small{font-size:11.5px;font-weight:600;color:var(--tx2)}
.prep-area.on{border-color:var(--verde);background:var(--verde-cl)}
.prep-area:focus-visible{outline:3px solid var(--mag);outline-offset:2px}

.ens-cab{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.ens-num{font-size:12px;font-weight:800;color:var(--tx2);margin-right:4px}

.ens-pide{font-weight:800;margin-bottom:8px}
.ens-check{list-style:none;display:grid;gap:8px;margin-bottom:12px}

.ens-dl{display:grid;gap:4px;margin:8px 0 14px}

/* ===== personaje y estudio (estudio.js) ===== */
.pj-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sup);border:2px solid var(--linea);border-bottom-width:4px;border-radius:var(--r);padding:8px 14px 8px 6px;margin-bottom:12px;cursor:pointer}

.pj-card-txt>b{font-size:15px;font-weight:800}
.pj-globo{position:relative;background:var(--verde-cl);color:var(--tx);font-size:13.5px;line-height:1.4;border-radius:12px;padding:7px 10px}

.pj-prox small{font-size:12px;color:var(--tx2)}
.pj-prox .barra{margin-top:3px;display:block}
.pj-prox .barra span{background:var(--mag)}
.pj-nuevo{font-size:11px;font-weight:800;color:#fff;background:var(--mag);border-radius:99px;padding:2px 8px;margin-left:4px;vertical-align:2px}
.pj-svg .pj-ojos,.escena .pj-ojos{transform-box:fill-box;transform-origin:center;animation:parpadeo 4.6s infinite}
@keyframes parpadeo{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.pj-escena{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;animation:respira 3.8s ease-in-out infinite}
@keyframes respira{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,.986)}}
.pj-escena.salta{animation:salto .6s cubic-bezier(.3,.7,.4,1)}
.pj-svg.salta{transform-origin:50% 100%;animation:salto .7s .35s cubic-bezier(.3,.7,.4,1) 2}
@keyframes salto{0%{transform:translateY(0)}35%{transform:translateY(-14%) scale(1.02,.98)}70%{transform:translateY(0) scale(1.04,.95)}100%{transform:none}}
.pj-escena:focus,.escena .ap:focus{outline:none}
.pj-escena:focus-visible,.escena .ap:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.pj-campo{margin-bottom:10px}

.pj-cab .pj-nombre{display:flex;gap:8px;align-items:center}
.pj-edit{flex:1;min-width:0;position:relative;display:flex;align-items:center}

.pj-nombre input{flex:1;min-width:0;font:inherit;font-weight:800;letter-spacing:-.02em;color:var(--tx);background:var(--sup);border:2px dashed var(--linea2);border-radius:12px;padding:5px 34px 5px 10px}
.pj-campo-estudio input{font-size:23px}
.pj-campo-personaje input{font-size:19px}
